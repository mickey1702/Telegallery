<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 selection:bg-indigo-500 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleCloud Ultra - Personal & Shared Telegram Cloud</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.6); }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .masonry-grid {
            column-count: 1;
            column-gap: 1.25rem;
        }
        @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1280px) { .masonry-grid { column-count: 4; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1.25rem; }
    </style>
</head>
<body class="h-full bg-slate-950 font-sans antialiased text-slate-100 flex flex-col overflow-hidden">

    <!-- PROFESSIONAL AUTH SCREEN -->
    <div id="authOverlay" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="w-full max-w-md glass-panel p-8 rounded-3xl shadow-2xl border border-slate-800 space-y-6">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-cyan-400 p-0.5 shadow-lg shadow-indigo-500/30 mx-auto flex items-center justify-center">
                    <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane text-xl text-indigo-400"></i>
                    </div>
                </div>
                <h2 class="text-xl font-extrabold text-white">TeleCloud Ultra</h2>
                <p class="text-xs text-slate-400" id="authSubtitle">Secure Telegram Cloud Portal</p>
            </div>

            <!-- Tab Switcher for Login / Register -->
            <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
                <button type="button" onclick="setAuthTab('login')" id="tabLoginBtn" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white transition">Sign In</button>
                <button type="button" onclick="setAuthTab('register')" id="tabRegBtn" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition">Create Account</button>
            </div>

            <form id="authForm" class="space-y-4" onsubmit="handleAuthSubmit(event)">
                <div id="emailFieldContainer" class="hidden">
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Email Address</label>
                    <input type="email" id="authEmail" placeholder="name@example.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Username</label>
                    <input type="text" id="authUsername" required placeholder="Enter your username" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Password</label>
                    <input type="password" id="authPassword" required placeholder="At least 6 characters" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition text-xs">
                    Sign In to Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD (Matches Image 2 Layout) -->
    <div id="appDashboard" class="h-full flex flex-col hidden">
        <!-- TOP NAV BAR -->
        <header class="h-16 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl px-4 lg:px-6 flex items-center justify-between z-30 shrink-0">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-400 p-0.5 shadow-lg shadow-indigo-500/20">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid font-bold text-indigo-400 text-sm fa-paper-plane"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                        TeleCloud <span class="px-2 py-0.5 text-[9px] uppercase font-mono bg-indigo-500/20 text-indigo-300 rounded border border-indigo-500/30">Ultra v3</span>
                    </h1>
                    <p class="text-[10px] text-slate-400 hidden sm:block">Unlimited Telegram Cloud Storage</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <span class="text-xs text-slate-300 font-semibold bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800">
                    <i class="fa-solid fa-user text-indigo-400 mr-1.5"></i> <span id="displayUsername">User</span>
                </span>
                <button onclick="openSettingsModal()" class="p-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 transition" title="Bot Settings">
                    <i class="fa-solid fa-gear text-xs"></i>
                </button>
                <button onclick="logout()" class="p-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 transition" title="Log Out">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                </button>
            </div>
        </header>

        <!-- WRAPPER -->
        <div class="flex-1 flex overflow-hidden">
            <!-- SIDEBAR -->
            <aside class="w-16 lg:w-60 border-r border-slate-800/80 bg-slate-950 p-3 flex flex-col justify-between shrink-0">
                <nav class="space-y-1">
                    <button onclick="switchTab('gallery')" id="nav-gallery" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-white bg-indigo-600/20 border border-indigo-500/30">
                        <i class="fa-solid fa-photo-film text-indigo-400"></i>
                        <span class="hidden lg:inline">Media Gallery</span>
                    </button>
                    <button onclick="switchTab('upload')" id="nav-upload" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-900">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span class="hidden lg:inline">Upload Portal</span>
                    </button>
                </nav>
            </aside>

            <!-- MAIN CONTENT AREA -->
            <main class="flex-1 overflow-y-auto p-4 lg:p-6 space-y-6">
                <!-- GALLERY SECTION -->
                <section id="sec-gallery" class="space-y-6">
                    <!-- Toolbar matching Image 2 -->
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 glass-panel p-4 rounded-2xl border border-slate-800">
                        <div class="relative flex-1 max-w-md">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" id="searchInput" oninput="filterMedia()" placeholder="Search media name, AI tags, OCR text..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <select id="typeFilter" onchange="filterMedia()" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300">
                                <option value="all">All Types</option>
                                <option value="image">Photos & Graphics</option>
                                <option value="video">Videos</option>
                                <option value="document">Documents</option>
                            </select>

                            <button onclick="switchTab('upload')" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition">
                                + Upload New
                            </button>
                        </div>
                    </div>

                    <!-- Media Grid -->
                    <div id="mediaContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        <!-- Populated dynamically -->
                    </div>
                </section>

                <!-- UPLOAD SECTION -->
                <section id="sec-upload" class="hidden space-y-6 max-w-2xl mx-auto">
                    <div class="glass-panel p-6 rounded-3xl border border-slate-800 space-y-4">
                        <h3 class="text-sm font-bold text-white">Upload to Telegram Topic / Folder</h3>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Target Folder / Topic</label>
                            <div class="flex gap-2">
                                <select id="uploadFolderSelect" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200">
                                    <option value="General">📁 General Storage</option>
                                    <option value="Medical Notes">📑 Medical Notes & Studies</option>
                                    <option value="Vacation">🏖️ Vacation 2026</option>
                                </select>
                                <button type="button" onclick="createNewFolder()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-indigo-300 rounded-xl text-xs font-semibold">
                                    + New Topic
                                </button>
                            </div>
                        </div>

                        <div class="border-2 border-dashed border-indigo-500/30 rounded-2xl p-8 text-center space-y-3">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-indigo-400"></i>
                            <p class="text-xs text-slate-300">Select file to send to Telegram supergroup topic</p>
                            <input type="file" id="fileInput" onchange="uploadFile(event)" class="text-xs text-slate-400 border border-slate-800 rounded-xl bg-slate-900 p-2 w-full">
                        </div>
                        <div id="uploadProgress" class="text-xs font-semibold text-center text-amber-400 hidden">
                            Dispatching to Telegram Bot API...
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="w-full max-w-md glass-panel p-6 rounded-3xl border border-slate-800 space-y-4 text-xs">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-white"><i class="fa-solid fa-robot text-indigo-400 mr-2"></i> Telegram Settings</h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            <div>
                <label class="block font-semibold text-slate-400 uppercase mb-1">Bot Token</label>
                <input type="text" id="cfgBotToken" placeholder="bot123456789:ABC..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
            </div>
            <div>
                <label class="block font-semibold text-slate-400 uppercase mb-1">Supergroup Chat ID</label>
                <input type="text" id="cfgChatId" placeholder="-1001234567890" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeSettingsModal()" class="px-3 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-xl">Save</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        let isRegisterMode = false;
        let mediaList = [
            { id: '1', name: '4K_Cinematic_Vacation_Drone.mp4', type: 'video', size: '4.8 GB', date: '2026-10-24', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', tags: ['Drone', '4K', 'Beach'] },
            { id: '2', name: 'Alpine_Mountain_Sunset.jpg', type: 'image', size: '8.4 MB', date: '2026-10-22', url: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80', tags: ['Mountain', 'Sunset'] }
        ];

        function setAuthTab(mode) {
            isRegisterMode = (mode === 'register');
            document.getElementById('tabLoginBtn').className = isRegisterMode ? 'flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition' : 'flex-1 py-2 rounded-lg bg-indigo-600 text-white transition';
            document.getElementById('tabRegBtn').className = isRegisterMode ? 'flex-1 py-2 rounded-lg bg-indigo-600 text-white transition' : 'flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition';
            document.getElementById('emailFieldContainer').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'Create Account & Enter' : 'Sign In to Dashboard';
            document.getElementById('authSubtitle').innerText = isRegisterMode ? 'Register a secure account' : 'Secure Telegram Cloud Portal';
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim();
            const pass = document.getElementById('authPassword').value;

            if (isRegisterMode) {
                const email = document.getElementById('authEmail').value.trim();
                if (!email || pass.length < 6) {
                    alert("Please enter a valid email and a password of at least 6 characters.");
                    return;
                }
                localStorage.setItem('telecloud_pass_' + username, pass);
                localStorage.setItem('telecloud_email_' + username, email);
                alert("Account successfully created!");
            } else {
                const savedPass = localStorage.getItem('telecloud_pass_' + username);
                if (savedPass && savedPass !== pass) {
                    alert("Incorrect password!");
                    return;
                }
            }

            localStorage.setItem('telecloud_user', username);
            initDashboard(username);
        }

        function initDashboard(username) {
            document.getElementById('displayUsername').innerText = username;
            document.getElementById('authOverlay').classList.add('hidden');
            document.getElementById('appDashboard').classList.remove('hidden');
            renderMedia();
            loadSettings();
        }

        function logout() {
            localStorage.removeItem('telecloud_user');
            document.getElementById('authOverlay').classList.remove('hidden');
            document.getElementById('appDashboard').classList.add('hidden');
        }

        function switchTab(tab) {
            document.getElementById('sec-gallery').classList.add('hidden');
            document.getElementById('sec-upload').classList.add('hidden');
            document.getElementById(`sec-${tab}`).classList.remove('hidden');

            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-indigo-600/20', 'border-indigo-500/30', 'text-white');
                el.classList.add('text-slate-400');
            });
            const activeNav = document.getElementById(`nav-${tab}`);
            if(activeNav) activeNav.classList.add('bg-indigo-600/20', 'border-indigo-500/30', 'text-white');
        }

        function renderMedia() {
            const container = document.getElementById('mediaContainer');
            const searchVal = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const typeVal = document.getElementById('typeFilter')?.value || 'all';

            let items = mediaList.filter(i => {
                const matchSearch = i.name.toLowerCase().includes(searchVal) || i.tags.some(t => t.toLowerCase().includes(searchVal));
                const matchType = typeVal === 'all' || i.type === typeVal;
                return matchSearch && matchType;
            });

            if (items.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 glass-card rounded-2xl text-xs text-slate-400">No media found.</div>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="glass-card rounded-2xl border border-slate-800 overflow-hidden space-y-2 p-3">
                    <div class="h-36 bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center">
                        ${item.type === 'image' ? `<img src="${item.url}" class="w-full h-full ob
